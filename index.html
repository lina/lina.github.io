<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Genie</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            margin-bottom: 20px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            font-size: 1em;
            border: none;
            border-radius: 5px 0 0 5px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #submit {
            border-radius: 0 5px 5px 0;
        }
        #lucky {
            border-radius: 5px;
            margin-left: 10px;
            background-color: #ff9800;
        }
        #lucky:hover {
            background-color: #e68a00;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            display: none;
            position: relative;
            height: 100px;
        }
        .loading-text {
            position: absolute;
            width: 100%;
            text-align: center;
            bottom: 0;
        }
        .game-controller {
            width: 60px;
            height: 40px;
            background-color: #f0f0f0;
            border-radius: 10px;
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .game-controller::before,
        .game-controller::after {
            content: '';
            position: absolute;
            background-color: #f0f0f0;
            border-radius: 50%;
        }
        .game-controller::before {
            width: 20px;
            height: 20px;
            top: -10px;
            left: 10px;
        }
        .game-controller::after {
            width: 20px;
            height: 20px;
            top: -10px;
            right: 10px;
        }
        @keyframes bounce-controller {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes color-change {
            0% { background-color: #ff4136; }
            25% { background-color: #ff851b; }
            50% { background-color: #2ecc40; }
            75% { background-color: #0074d9; }
            100% { background-color: #b10dc9; }
        }
        .bouncing {
            animation: bounce-controller 0.5s ease-in-out infinite,
                    color-change 2s linear infinite;
        }
        .bouncing::before,
        .bouncing::after {
            animation: color-change 2s linear infinite;
        }
        .creations {
            margin-top: 30px;
        }
        .creation {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }
        .creation:hover {
            transform: translateY(-5px);
        }
        .creation h3 {
            margin-top: 0;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px);}
            60% {transform: translateY(-15px);}
        }
        body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #FF61D2, #FE9090, #FFF94C, #4DEEEA);
        background-size: 300% 300%;
        animation: gradientBG 10s ease infinite;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
    }
    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }
    .container {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        max-width: 800px;
        width: 100%;
    }
    h1 {
        font-family: 'Fredoka One', cursive;
        text-align: center;
        margin-bottom: 30px;
        font-size: 3.5em;
        color: #FF1493;
        text-shadow: 3px 3px 0px #00FFFF, 6px 6px 0px #FF8D1A;
        animation: bounce 2s ease infinite;
    }
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
        40% {transform: translateY(-20px);}
        60% {transform: translateY(-10px);}
    }
    .input-group {
        display: flex;
        margin-bottom: 30px;
    }
    input {
        flex-grow: 1;
        padding: 15px;
        font-size: 1.2em;
        border: none;
        border-radius: 15px 0 0 15px;
        outline: none;
        background-color: rgba(255, 255, 255, 0.9);
        color: #333;
        transition: all 0.3s ease;
    }
    input:focus {
        box-shadow: 0 0 15px #FF61D2;
    }
    button {
        padding: 15px 30px;
        font-size: 1.2em;
        border: none;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        text-transform: uppercase;
    }
    #submit {
        background-color: #FF3131;
        border-radius: 0 15px 15px 0;
    }
    #submit:hover {
        background-color: #FF1493;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
    }
    #lucky {
        background-color: #4DeeEA;
        border-radius: 15px;
        margin-left: 10px;
    }
    #lucky:hover {
        background-color: #00FFFF;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
    }
    .loading {
        text-align: center;
        font-size: 1.5em;
        margin: 30px 0;
        display: none;
        position: relative;
        height: 120px;
    }
    .loading-text {
        position: absolute;
        width: 100%;
        text-align: center;
        bottom: 0;
        color: #FF8D1A;
        font-weight: 600;
    }
    .game-controller {
        width: 80px;
        height: 50px;
        background-color: #FF61D2;
        border-radius: 15px;
        position: relative;
        display: inline-block;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(255, 97, 210, 0.4);
    }
    .game-controller::before,
    .game-controller::after {
        content: '';
        position: absolute;
        background-color: #FF61D2;
        border-radius: 50%;
        box-shadow: 0 3px 10px rgba(255, 97, 210, 0.4);
    }
    .game-controller::before {
        width: 30px;
        height: 30px;
        top: -15px;
        left: 15px;
    }
    .game-controller::after {
        width: 30px;
        height: 30px;
        top: -15px;
        right: 15px;
    }
    @keyframes bounce-controller {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-30px) rotate(5deg); }
    }
    @keyframes color-change {
        0% { background-color: #FF61D2; }
        25% { background-color: #FFF700; }
        50% { background-color: #7CFF01; }
        75% { background-color: #00FFFF; }
        100% { background-color: #FF61D2; }
    }
    .bouncing {
        animation: bounce-controller 0.7s ease-in-out infinite,
                   color-change 3s linear infinite;
    }
    .bouncing::before,
    .bouncing::after {
        animation: color-change 3s linear infinite;
    }
    .creations {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }
    .creation {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        padding: 20px;
        transition: all 0.3s ease;
        text-align: center;
    }
    .creation:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .creation h3 {
        margin-top: 0;
        color: #FF1493;
        font-size: 1.3em;
    }
    .creation p {
        color: #333;
        font-size: 0.9em;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>10 Second Game Builder</h1>
        <div class="input-group">
            <input type="text" id="gameInput" placeholder="Enter your wildest game idea...">
            <button id="submit">Build Magic!</button>
            <button id="lucky">Surprise Me!</button>
        </div>
        <div id="loading" class="loading">
            <div class="game-controller bouncing"></div>
            <div class="loading-text"></div>
        </div>
        <div id="creations" class="creations"></div>
    </div>
    <canvas id="confetti-canvas"></canvas>
    <script>
        function triggerConfetti() {
        const duration = 5 * 1000; // Extended duration for more joy
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 45, spread: 360, ticks: 100, zIndex: 0 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Euphoria-inducing color palette
        const colors = [
            '#FF61D2', // Neon Pink
            '#00FFFF', // Cyan
            '#FFF700', // Lemon Yellow
            '#7CFF01', // Lime Green
            '#FF3131', // Neon Red
            '#4DeeEA', // Electric Blue
            '#FF8D1A', // Bright Orange
            '#C100FF', // Electric Purple
            '#00FF7F', // Spring Green
            '#FF1493', // Deep Pink
        ];

        const shapes = ['star', 'circle', 'square'];

        function createBurst(origin) {
            confetti(Object.assign({}, defaults, {
                particleCount: randomInRange(80, 120),
                origin: origin,
                colors: colors,
                shapes: shapes,
                gravity: randomInRange(0.8, 1.2),
                scalar: randomInRange(0.9, 1.5),
                drift: randomInRange(-0.5, 0.5),
                ticks: randomInRange(200, 300)
            }));
        }

        const interval = setInterval(function() {
            const timeLeft = animationEnd - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            // Center burst
            createBurst({ x: 0.5, y: 0.5 });

            // Random bursts
            createBurst({ x: Math.random(), y: Math.random() - 0.2 });
            createBurst({ x: Math.random(), y: Math.random() - 0.2 });

        }, 200);

        // Add a final, grand burst at the end
        setTimeout(() => {
            confetti({
                particleCount: 300,
                spread: 180,
                origin: { x: 0.5, y: 0.5 },
                colors: colors,
                shapes: shapes,
                gravity: 0.8,
                scalar: 1.5,
                drift: 0,
                ticks: 400
            });
        }, duration - 500);
    }

        const gameInput = document.getElementById('gameInput');
        const submitBtn = document.getElementById('submit');
        const luckyBtn = document.getElementById('lucky');
        const loading = document.getElementById('loading');
        const creations = document.getElementById('creations');
        const loadingMessages = [
        "Assembling pixels with pixie dust...",
        "Generating fun at lightspeed...",
        "Cooking up a storm of excitement...",
        "Unleashing a tornado of creativity...",
        "Sprinkling extra magic powder...",
        "Turbocharging your brilliant idea..."
    ];

    const exampleGames = [
        "Neon Ninja Parkour Adventure",
        "Cosmic Cupcake Bakery Tycoon",
        "Dinosaur DJ Dance-Off",
        "Time-Traveling Pirate Puzzle",
        "Unicorn Racing in Rainbow Land"
    ];


        function showLoading() {
            loading.style.display = 'block';
            loading.innerHTML = `
                <div class="game-controller bouncing"></div>
                <div class="loading-text"></div>
            `;
            const loadingText = loading.querySelector('.loading-text');
            let messageIndex = 0;
            return setInterval(() => {
                loadingText.textContent = loadingMessages[messageIndex];
                messageIndex = (messageIndex + 1) % loadingMessages.length;
            }, 400);
        }


        function hideLoading(interval) {
            clearInterval(interval);
            loading.style.display = 'none';
        }

        function addCreation(idea) {
            const creation = document.createElement('div');
            creation.className = 'creation';
            creation.innerHTML = `<h3>${idea}</h3><p>A fascinating game created in just one minute!</p>`;
            creation.style.animation = 'bounce 1s';
            creations.insertBefore(creation, creations.firstChild);
        }

        function buildGame(idea) {
            const loadingInterval = showLoading();
            setTimeout(() => {
                hideLoading(loadingInterval);
                addCreation(idea);
                triggerConfetti();
            }, 3000);
        }

        submitBtn.addEventListener('click', () => {
            const idea = gameInput.value.trim();
            if (idea) {
                buildGame(idea);
                gameInput.value = '';
            }
        });

        luckyBtn.addEventListener('click', () => {
            const randomIdea = exampleGames[Math.floor(Math.random() * exampleGames.length)];
            gameInput.value = randomIdea;
            buildGame(randomIdea);
        });

        gameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        // Initialize with example creations
        exampleGames.forEach(game => addCreation(game));
    </script>
</body>
</html>
