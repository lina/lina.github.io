        * {

        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes sparkleRainbow {
            0% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(180deg) brightness(1.2); }
            100% { filter: hue-rotate(360deg) brightness(1); }
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.1); filter: blur(0px); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shine {
            0% { background-position: -100% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(5deg); }
            75% { transform: translateY(15px) rotate(-5deg); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 50px rgba(139, 92, 246, 0.8), 0 0 100px rgba(139, 92, 246, 0.5); }
            100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3); }
        }
        button {
            margin-bottom:30px;
        }
        .bg-gradient {
            background: linear-gradient(-45deg, #0F172A, #1E293B, #2E1065, #1E40AF);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid rgba(139, 92, 246, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 3s infinite;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(139, 92, 246, 0.2),
                transparent
            );
            animation: shine 8s infinite;
        }

        .sparkle-icon {
            animation: sparkleRainbow 3s ease-in-out infinite;
        }

        .button {
            background: linear-gradient(45deg, #6D28D9, #4F46E5, #7C3AED);
            background-size: 200% 200%;
            animation: gradient 5s ease infinite;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.6);
            letter-spacing: 2px;
        }

        .button:active {
            transform: scale(0.98) translateY(0);
        }

        .pitch-text {
            animation: pop 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            will-change: transform;
        }

        .highlight {
            background: linear-gradient(120deg, #6D28D9, #4F46E5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }

            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 92, 246, 0.9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            animation: pop 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
    </style>
