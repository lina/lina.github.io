<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Wrapper Ideas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --violet-50: #f5f3ff;
      --violet-100: #ede9fe;
      --violet-500: #8b5cf6;
      --violet-600: #7c3aed;
      --violet-700: #6d28d9;
      --violet-800: #5b21b6;
      --violet-900: #4c1d95;
      --pink-100: #fce7f3;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-800: #9d174d;
      --pink-900: #831843;
      --blue-100: #dbeafe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --yellow-500: #eab308;
      --purple-500: #a855f7;
      --orange-500: #f97316;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
      padding: 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .title {
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(to right, var(--pink-500), var(--purple-500), var(--violet-500));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 0.75rem;
      border: 2px solid var(--violet-100);
      overflow: hidden;
      position: relative;
      transition: all 0.3s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.5rem;
    }

    .card:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, 
        rgba(236, 72, 153, 0.1),
        rgba(168, 85, 247, 0.1),
        rgba(139, 92, 246, 0.1));
      opacity: 0.5;
    }

    .card-content {
      position: relative;
      padding: 2rem;
    }

    .section {
      margin-bottom: 2rem;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gray-500);
      margin-bottom: 0.75rem;
    }

    .concept {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(to right, var(--violet-600), var(--pink-600));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 1rem;
      background-color: var(--violet-50);
      border-radius: 0.75rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      padding: 0.375rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      transition: all 0.3s;
    }

    .tag:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .feature-tag {
      background: var(--violet-100);
      color: var(--violet-800);
    }

    .monetization-tag {
      background: var(--pink-100);
      color: var(--pink-800);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      font-size: 1.125rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .button-primary {
      background: var(--violet-600);
      color: white;
    }

    .button-primary:hover:not(:disabled) {
      background: var(--violet-700);
      transform: scale(1.05);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .button-outline {
      background: transparent;
      border: 1px solid var(--violet-600);
      color: var(--violet-600);
    }

    .button-outline:hover:not(:disabled) {
      background: var(--violet-50);
      transform: scale(1.05);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .alert {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: linear-gradient(to right, var(--violet-500), var(--pink-500));
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .loading {
      text-align: center;
      padding: 3rem 0;
    }

    .loading-icon {
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const baseTypes = [
      "translator", "generator", "analyzer", "coach", "assistant", "planner", "curator", "predictor", 
      "optimizer", "writer", "creator", "manager", "helper", "advisor", "tutor"
    ];

    const domains = [
      "social media", "content", "career", "education", "fitness", "lifestyle", "gaming", "tech", 
      "creative", "business", "fashion", "wellness", "entertainment", "productivity", "learning"
    ];

    const styles = [
      "that speaks in viral TikTok quotes",
      "with Gen Z energy",
      "that's giving main character energy",
      "with elite rizz",
      "that passes the vibe check",
      "with that chronically online energy",
      "that's actually funny fr fr",
      "with no miss content",
      "with extremely online voice",
      "that's straight bussin",
      "with that aesthetic energy",
      "that hits different"
    ];

    const features = [
      "daily streaks", "achievement badges", "level system", "progress tracking", "reward points",
      "mystery rewards", "daily challenges", "weekly missions", "custom milestones",
      "friend battles", "team competitions", "social sharing", "leaderboards", "group challenges",
      "collaborative tasks", "friend referrals", "community voting", "social feed",
      "custom themes", "AI avatars", "profile badges", "personal stats", "custom emojis",
      "style presets", "mood tracking", "goal setting", "personal dashboard",
      "offline mode", "cloud sync", "quick export", "data insights", "auto-save",
      "cross-platform", "voice commands", "dark mode", "quick actions"
    ];

    const monetization = [
      "pro subscription", "premium filters", "exclusive themes", "priority features", "limited drops",
      "creator marketplace", "boost tokens", "premium plugins", "VIP access", "custom badges",
      "special effects", "advanced analytics", "team features", "API access", "white label options"
    ];

    const generateConcept = () => {
      const type = baseTypes[Math.floor(Math.random() * baseTypes.length)];
      const domain = domains[Math.floor(Math.random() * domains.length)];
      const style = styles[Math.floor(Math.random() * styles.length)];
      
      const templates = [
        `AI ${domain} ${type} ${style}`,
        `${domain} ${type} that's ${style}`,
        `${type} for ${domain} ${style}`,
        `${style} ${domain} ${type}`
      ];
      
      return templates[Math.floor(Math.random() * templates.length)];
    };

    function AppIdeaGenerator() {
      const [currentIdea, setCurrentIdea] = React.useState(null);
      const [isGenerating, setIsGenerating] = React.useState(false);
      const [showAlert, setShowAlert] = React.useState(false);
      const [streak, setStreak] = React.useState(0);
      const [totalGenerated, setTotalGenerated] = React.useState(0);

      const getStreakLevel = () => {
        if (streak >= 50) return { emoji: "👑", title: "LEGENDARY", color: "#eab308" };
        if (streak >= 30) return { emoji: "⚡", title: "EPIC", color: "#a855f7" };
        if (streak >= 20) return { emoji: "🔥", title: "FIRE", color: "#f97316" };
        if (streak >= 10) return { emoji: "✨", title: "RISING", color: "#3b82f6" };
        return { emoji: "🌟", title: "ROOKIE", color: "#6b7280" };
      };

      const generateIdea = () => {
        setIsGenerating(true);
        setStreak(prev => prev + 1);
        setTotalGenerated(prev => prev + 1);

        const concept = generateConcept();
        const randomFeatures = Array.from(new Set(
          Array.from({ length: 12 }, () => features[Math.floor(Math.random() * features.length)])
        )).slice(0, 6);
        const randomMonetization = Array.from(new Set(
          Array.from({ length: 4 }, () => monetization[Math.floor(Math.random() * monetization.length)])
        )).slice(0, 2);

        setCurrentIdea({
          concept,
          features: randomFeatures,
          monetization: randomMonetization
        });

        setTimeout(() => {
          setIsGenerating(false);
        }, 500);
      };

      const handleShare = () => {
        if (currentIdea) {
          const shareText = `Check out this app idea!\n\n${currentIdea.concept}\n\nFeatures:\n${currentIdea.features.join('\n')}\n\nMonetization:\n${currentIdea.monetization.join('\n')}`;
          navigator.clipboard.writeText(shareText);
          setShowAlert(true);
          setTimeout(() => setShowAlert(false), 2000);
        }
      };

      React.useEffect(() => {
        lucide.createIcons();
      }, [currentIdea, isGenerating]);

      return (
        <div className="container">
          <div className="header">
            <h1 className="title">AI Wrapper Ideas</h1>
            
            <div className="stats-bar">
              <div className="stat" style={{ background: 'var(--violet-100)' }}>
                <i data-lucide="crown" style={{ color: 'var(--violet-600)', width: '1rem', height: '1rem' }}></i>
                <span style={{ color: getStreakLevel().color }}>
                  {getStreakLevel().emoji} Level: {getStreakLevel().title}
                </span>
              </div>
              
              <div className="stat" style={{ background: 'var(--pink-100)' }}>
                <i data-lucide="flame" style={{ color: 'var(--pink-600)', width: '1rem', height: '1rem' }}></i>
                <span style={{ color: 'var(--pink-600)' }}>
                  Streak: {streak}
                </span>
              </div>
              
              <div className="stat" style={{ background: 'var(--blue-100)' }}>
                <i data-lucide="star" style={{ color: 'var(--blue-600)', width: '1rem', height: '1rem' }}></i>
                <span style={{ color: 'var(--blue-600)' }}>
                  Total: {totalGenerated}
                </span>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-gradient"></div>
            <div className="card-content">
              {!currentIdea && !isGenerating && (
                <div className="loading">
                  <i data-lucide="brain" style={{ width: '6rem', height: '6rem', color: 'var(--violet-500)' }}></i>
                  <p style={{ fontSize: '1.25rem
