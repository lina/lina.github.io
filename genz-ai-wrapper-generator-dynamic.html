<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wrapper Ideas Generator</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --violet-50: #f5f3ff;
            --violet-100: #ede9fe;
            --violet-500: #8b5cf6;
            --violet-600: #7c3aed;
            --violet-700: #6d28d9;
            --violet-900: #4c1d95;
            --pink-100: #fce7f3;
            --pink-500: #ec4899;
            --pink-600: #db2777;
            --blue-100: #dbeafe;
            --blue-600: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, system-ui, sans-serif;
        }

        body {
            background: #f8f9fa;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(to right, var(--pink-500), var(--violet-500));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            border: 2px solid var(--violet-100);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, 
                rgba(236, 72, 153, 0.1),
                rgba(139, 92, 246, 0.1));
            z-index: 0;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .section {
            margin-bottom: 2rem;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .concept {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem;
            background: var(--violet-50);
            border-radius: 0.75rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--violet-600), var(--pink-600));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: transform 0.2s;
        }

        .tag:hover {
            transform: scale(1.05);
        }

        .feature-tag {
            background: var(--violet-100);
            color: var(--violet-900);
        }

        .monetization-tag {
            background: var(--pink-100);
            color: var(--pink-600);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .button-primary {
            background: var(--violet-600);
            color: white;
        }

        .button-primary:hover:not(:disabled) {
            background: var(--violet-700);
            transform: scale(1.05);
        }

        .button-outline {
            background: transparent;
            border: 2px solid var(--violet-600);
            color: var(--violet-600);
        }

        .button-outline:hover:not(:disabled) {
            background: var(--violet-50);
            transform: scale(1.05);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(to right, var(--violet-600), var(--pink-600));
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s ease-out;
            z-index: 100;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .empty-state, .loading-state {
            text-align: center;
            padding: 4rem 0;
        }

        .icon-large {
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            color: var(--violet-500);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">AI Wrapper Ideas</h1>
            <div class="stats-bar">
                <div class="stat-pill" style="background: var(--violet-100)">
                    <i data-lucide="crown" style="width: 1rem; height: 1rem; color: var(--violet-600)"></i>
                    <span id="level-text"></span>
                </div>
                <div class="stat-pill" style="background: var(--pink-100)">
                    <i data-lucide="flame" style="width: 1rem; height: 1rem; color: var(--pink-600)"></i>
                    <span id="streak-text"></span>
                </div>
                <div class="stat-pill" style="background: var(--blue-100)">
                    <i data-lucide="star" style="width: 1rem; height: 1rem; color: var(--blue-600)"></i>
                    <span id="total-text"></span>
                </div>
            </div>
        </div>

        <div class="card">
            <div id="card-content" class="card-content">
                <!-- Content will be dynamically inserted here -->
            </div>
        </div>

        <div class="buttons">
            <button id="generate-btn" class="button button-primary">
                <i data-lucide="sparkles"></i>
                Generate Idea
            </button>
            <button id="share-btn" class="button button-outline" disabled>
                <i data-lucide="share-2"></i>
                Share
            </button>
        </div>
    </div>

    <script>
        // Data arrays
        const baseTypes = [
            "translator", "generator", "analyzer", "coach", "assistant", "planner", "curator", 
            "predictor", "optimizer", "writer", "creator", "manager", "helper", "advisor", "tutor"
        ];

        const domains = [
            "social media", "content", "career", "education", "fitness", "lifestyle", "gaming", 
            "tech", "creative", "business", "fashion", "wellness", "entertainment", "productivity"
        ];

        const styles = [
            "that speaks in viral TikTok quotes",
            "with Gen Z energy",
            "that's giving main character energy",
            "with elite rizz",
            "that passes the vibe check",
            "with that chronically online energy",
            "that's actually funny fr fr",
            "with no miss content",
            "with extremely online voice",
            "that's straight bussin",
            "with that aesthetic energy",
            "that hits different"
        ];

        const features = [
            "daily streaks", "achievement badges", "level system", "progress tracking",
            "mystery rewards", "daily challenges", "weekly missions", "custom milestones",
            "friend battles", "team competitions", "social sharing", "leaderboards",
            "collaborative tasks", "friend referrals", "community voting", "social feed",
            "custom themes", "AI avatars", "profile badges", "personal stats",
            "style presets", "mood tracking", "goal setting", "personal dashboard",
            "offline mode", "cloud sync", "quick export", "data insights"
        ];

        const monetization = [
            "pro subscription", "premium filters", "exclusive themes", "priority features",
            "limited drops", "creator marketplace", "boost tokens", "premium plugins",
            "VIP access", "custom badges", "special effects", "advanced analytics"
        ];

        // State
        let state = {
            currentIdea: null,
            isGenerating: false,
            streak: 0,
            totalGenerated: 0
        };

        // Functions
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generateConcept() {
            const type = getRandomItem(baseTypes);
            const domain = getRandomItem(domains);
            const style = getRandomItem(styles);
            
            const templates = [
                `AI ${domain} ${type} ${style}`,
                `${domain} ${type} that's ${style}`,
                `${type} for ${domain} ${style}`
                // `${style} ${domain} ${type}`
            ];
            
            return getRandomItem(templates);
        }

        function getRandomUniqueItems(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function getStreakLevel() {
            if (state.streak >= 50) return { emoji: "👑", title: "LEGENDARY", color: "#eab308" };
            if (state.streak >= 30) return { emoji: "⚡", title: "EPIC", color: "#a855f7" };
            if (state.streak >= 20) return { emoji: "🔥", title: "FIRE", color: "#f97316" };
            if (state.streak >= 10) return { emoji: "✨", title: "RISING", color: "#3b82f6" };
            return { emoji: "🌟", title: "ROOKIE", color: "#6b7280" };
        }

        function updateStats() {
            const level = getStreakLevel();
            document.getElementById('level-text').innerHTML = `${level.emoji} Level: ${level.title}`;
            document.getElementById('level-text').style.color = level.color;
            document.getElementById('streak-text').innerHTML = `Streak: ${state.streak}`;
            document.getElementById('total-text').innerHTML = `Total: ${state.totalGenerated}`;
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <i data-lucide="gift"></i>
                ${message}
            `;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 2000);
        }

        function renderEmptyState() {
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="empty-state">
                    <i data-lucide="brain" class="icon-large"></i>
                    <p style="font-size: 1.25rem; color: #666;">
                        Click generate to create your next billion-dollar idea ✨
                    </p>
                </div>
            `;
            lucide.createIcons();
        }

        function renderLoadingState() {
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="loading-state">
                    <i data-lucide="refresh-cw" class="icon-large spin"></i>
                    <p style="font-size: 1.25rem; color: #666;">
                        Brewing something legendary... 🚀
                    </p>
                </div>
            `;
            lucide.createIcons();
        }

        function renderIdea() {
            if (!state.currentIdea) return renderEmptyState();
            
            const content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="section">
                    <div class="section-label">
                        <i data-lucide="rocket"></i>
                        Concept
                    </div>
                    <div class="concept">${state.currentIdea.concept}</div>
                </div>

                <div class="section">
                    <div class="section-label">
                        <i data-lucide="star"></i>
                        Key Features
                    </div>
                    <div class="tags">
                        ${state.currentIdea.features.map(feature => 
                            `<span class="tag feature-tag">${feature}</span>`
                        ).join('')}
                    </div>
                </div>

                <div class="section">
                    <div class="section-label">
                        <i data-lucide="trophy"></i>
                        Monetization
                    </div>
                    <div class="tags">
                        ${state.currentIdea.monetization.map(item => 
                            `<span class="tag monetization-tag">${item}</span>`
                        ).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function generateIdea() {
            state.isGenerating = true;
            state.streak++;
            state.totalGenerated++;
            updateStats();
            
            const generateBtn = document.getElementById('generate-btn');
            const shareBtn = document.getElementById('share-btn');
            generateBtn.disabled = true;
            shareBtn.disabled = true;
            
            renderLoadingState();

            // Simulate loading time
            setTimeout(() => {
                state.currentIdea = {
                    concept: generateConcept(),
                    features: getRandomUniqueItems(features, 6),
                    monetization: getRandomUniqueItems(monetization, 2)
                };
                
                state.isGenerating = false;
                generateBtn.disabled = false;
                shareBtn.disabled = false;
                renderIdea();
            }, 500);
        }

        function shareIdea() {
            if (!state.currentIdea) return;
            
            const shareText = `Check out this app idea!\n\n${state.currentIdea.concept}\n\nFeatures:\n${state.currentIdea.features.join('\n')}\n\nMonetization:\n${state.currentIdea.monetization.join('\n')}`;
            
            navigator.clipboard.writeText(shareText)
                .then(() => showToast('Idea copied to clipboard! 🎉'))
                .catch(() => showToast('Failed to copy to clipboard'));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Create Lucide icons
            lucide.createIcons();
            
            // Initial render
            updateStats();
            renderEmptyState();
            
            // Event listeners
            document.getElementById('generate-btn').addEventListener('click', generateIdea);
            document.getElementById('share-btn').addEventListener('click', shareIdea);
        });
    </script>
</body>
</html>
