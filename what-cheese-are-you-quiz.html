<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Cheese Are You?</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .fade {
            opacity: 0;
            transition: opacity 0.5s;
        }
        .fade.show {
            opacity: 1;
        }
        .quiz-button {
            background-color: white;
            border: 1px solid #ddd;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            width: 100%;
            text-align: left;
            transition: all 0.3s;
        }
        .quiz-button:hover {
            background-color: #fef3c7;
            border-color: #fcd34d;
        }
        .progress-bar {
            transition: width 0.5s;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-xl">
        <!-- Header -->
        <div class="bg-yellow-50 p-6 rounded-t-lg border-b border-yellow-100">
            <h1 class="text-3xl font-bold text-center">🧀 What Cheese Are You? 🧀</h1>
        </div>

        <!-- Quiz Container -->
        <div id="quizContainer" class="p-6">
            <!-- Content will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        // Quiz Data
        const questions = [
            {
                text: "How would you spend your ideal weekend?",
                options: [
                    { text: "Hosting a lively party 🎉", personality: "extroverted" },
                    { text: "Quiet reading at home 📚", personality: "mild" },
                    { text: "Mountain hiking ⛰️", personality: "sharp" },
                    { text: "Fine dining 🍽️", personality: "refined" }
                ]
            },
            {
                text: "What's your approach to life?",
                options: [
                    { text: "Bold and adventurous 🌟", personality: "sharp" },
                    { text: "Calm and easy-going 🌸", personality: "mild" },
                    { text: "Sophisticated and cultured 🎭", personality: "refined" },
                    { text: "Fun and outgoing 🎈", personality: "extroverted" }
                ]
            },
            {
                text: "Choose your dream home:",
                options: [
                    { text: "Downtown penthouse 🏢", personality: "extroverted" },
                    { text: "Cozy cottage 🏡", personality: "mild" },
                    { text: "Mountain cabin 🌲", personality: "sharp" },
                    { text: "Historic mansion 🏰", personality: "refined" }
                ]
            },
            {
                text: "Pick your favorite drink:",
                options: [
                    { text: "Craft beer 🍺", personality: "sharp" },
                    { text: "Herbal tea 🫖", personality: "mild" },
                    { text: "Fine wine 🍷", personality: "refined" },
                    { text: "Fun cocktail 🍹", personality: "extroverted" }
                ]
            }
        ];

        const results = {
            extroverted: {
                cheese: "Cheddar",
                description: "You're bold and outgoing like a sharp Cheddar! Social and versatile, you're the life of any party and everyone's favorite.",
                traits: ["Outgoing", "Energetic", "Fun", "Social"]
            },
            mild: {
                cheese: "Mozzarella",
                description: "You're gentle and adaptable like fresh Mozzarella! Easy-going and universally liked, you bring harmony to any situation.",
                traits: ["Gentle", "Adaptable", "Kind", "Reliable"]
            },
            sharp: {
                cheese: "Blue Cheese",
                description: "You're bold and distinctive like Blue Cheese! You have a strong personality and aren't afraid to stand out from the crowd.",
                traits: ["Bold", "Unique", "Adventurous", "Strong-willed"]
            },
            refined: {
                cheese: "Brie",
                description: "You're sophisticated and smooth like Brie! Cultured and elegant, you appreciate the finer things in life.",
                traits: ["Sophisticated", "Elegant", "Cultured", "Refined"]
            }
        };

        // Quiz State
        let currentQuestion = 0;
        let answers = [];

        // Quiz Functions
        function showQuestion() {
            const question = questions[currentQuestion];
            const progress = ((currentQuestion + 1) / questions.length) * 100;

            const html = `
                <div class="fade">
                    <div class="mb-6">
                        <div class="flex justify-between text-sm text-gray-600 mb-2">
                            <span>Question ${currentQuestion + 1} of ${questions.length}</span>
                            <span>${Math.round(progress)}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-yellow-500 h-2 rounded-full progress-bar" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <h2 class="text-xl font-bold mb-6">${question.text}</h2>

                    <div class="space-y-3">
                        ${question.options.map((option, index) => `
                            <button 
                                onclick="selectAnswer('${option.personality}')" 
                                class="quiz-button"
                            >
                                ${option.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('quizContainer').innerHTML = html;
            setTimeout(() => {
                document.querySelector('.fade').classList.add('show');
            }, 50);
        }

        function showResult() {
            const personalityCount = {};
            answers.forEach(answer => {
                personalityCount[answer] = (personalityCount[answer] || 0) + 1;
            });

            const personality = Object.entries(personalityCount)
                .sort((a, b) => b[1] - a[1])[0][0];

            const result = results[personality];

            const html = `
                <div class="fade text-center">
                    <h2 class="text-3xl font-bold mb-4">You are ${result.cheese}! 🧀</h2>
                    <p class="text-xl mb-8">${result.description}</p>
                    
                    <div class="bg-yellow-50 p-6 rounded-lg mb-8">
                        <h3 class="font-bold mb-4">Your Key Traits:</h3>
                        <div class="flex flex-wrap justify-center gap-2">
                            ${result.traits.map(trait => `
                                <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">
                                    ${trait}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <button 
                        onclick="restartQuiz()" 
                        class="bg-yellow-500 hover:bg-yellow-600 text-white px-8 py-3 rounded-lg transition-colors"
                    >
                        Take the Quiz Again
                    </button>
                </div>
            `;

            document.getElementById('quizContainer').innerHTML = html;
            setTimeout(() => {
                document.querySelector('.fade').classList.add('show');
            }, 50);
        }

        function selectAnswer(personality) {
            answers.push(personality);
            document.querySelector('.fade').classList.remove('show');
            
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    showQuestion();
                } else {
                    showResult();
                }
            }, 500);
        }

        function restartQuiz() {
            currentQuestion = 0;
            answers = [];
            document.querySelector('.fade').classList.remove('show');
            setTimeout(showQuestion, 500);
        }

        // Start the quiz
        document.addEventListener('DOMContentLoaded', showQuestion);
    </script>
</body>
</html>
