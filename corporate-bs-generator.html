<!DOCTYPE html>
<html>
<head>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes shine {
            0% { background-position: -100% 50%; }
            100% { background-position: 200% 50%; }
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 90%;
            text-align: center;
            transform-style: preserve-3d;
            perspective: 1000px;
            animation: float 6s ease-in-out infinite;
        }

        .output {
            font-size: 2rem;
            margin: 2rem 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
            color: #333;
            padding: 2rem;
            border-radius: 16px;
            background: linear-gradient(120deg, rgba(255,255,255,0.3), rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            background-size: 200% 100%;
            transition: all 0.3s ease;
            transform: translateZ(20px);
        }

        .output.shine {
            animation: shine 2s forwards;
        }

        button {
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            color: white;
            border: none;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
            transform: translateZ(30px);
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateZ(40px) scale(1.1);
            box-shadow: 0 15px 30px rgba(255, 65, 108, 0.4);
        }

        button:active {
            transform: translateZ(20px) scale(0.95);
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.13) 77%, rgba(255,255,255,0.5) 92%, rgba(255,255,255,0.0) 100%);
            transform: rotate(45deg);
            transition: all 0.3s ease;
        }

        button:hover::after {
            left: 100%;
        }

        h1 {
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3rem;
            margin-bottom: 2rem;
            transform: translateZ(50px);
            text-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f0f0f0;
            position: absolute;
            animation: confetti 5s ease-in-out -2s infinite;
            transform-origin: center;
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(1000px) rotateZ(720deg); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Corporate BS Generator</h1>
        <div id="output" class="output">Click the button for instant corporate enlightenment! ✨</div>
        <button onclick="generateBS()">Generate Pure Gold</button>
    </div>

    <script>
        const words = {
            verbs: ['leverage', 'synergize', 'optimize', 'revolutionize', 'streamline', 'innovate', 'implement', 'transform', 'empower', 'iterate', 'disrupt', 'accelerate', 'gamify', 'bootstrap', 'unleash'],
            adjectives: ['agile', 'robust', 'scalable', 'cutting-edge', 'disruptive', 'innovative', 'strategic', 'dynamic', 'sustainable', 'seamless', 'pivotal', 'cloud-native', 'hyperscale', 'quantum', 'blockchain-enabled'],
            nouns: ['paradigm', 'solution', 'architecture', 'mindshare', 'strategy', 'blockchain', 'AI', 'synergy', 'framework', 'ecosystem', 'metaverse', 'neural-network', 'web3', 'DevOps', 'digital-transformation'],
            buzzwords: ['going forward', 'in the space', 'at scale', 'end-to-end', 'deep dive', 'low-hanging fruit', 'value add', 'win-win', '10,000 foot view', 'thought leadership', 'in the wild', 'as a service', 'on the blockchain', 'with machine learning', 'in the cloud']
        };

        function getRandomWord(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function generateBS() {
            const output = document.getElementById('output');
            const button = document.querySelector('button');
            
            // Button pop animation
            button.style.animation = 'pop 0.3s ease';
            setTimeout(() => button.style.animation = '', 300);

            // Output shine effect
            output.classList.add('shine');
            setTimeout(() => output.classList.remove('shine'), 2000);

            const templates = [
                `Let's ${getRandomWord(words.verbs)} our ${getRandomWord(words.adjectives)} ${getRandomWord(words.nouns)} ${getRandomWord(words.buzzwords)}.`,
                `We need to ${getRandomWord(words.verbs)} the ${getRandomWord(words.adjectives)} ${getRandomWord(words.nouns)} to achieve ${getRandomWord(words.adjectives)} outcomes.`,
                `Our ${getRandomWord(words.adjectives)} approach to ${getRandomWord(words.nouns)} will ${getRandomWord(words.verbs)} the industry ${getRandomWord(words.buzzwords)}.`,
                `By ${getRandomWord(words.verbs)}ing our ${getRandomWord(words.nouns)}, we can ${getRandomWord(words.verbs)} the ${getRandomWord(words.adjectives)} landscape ${getRandomWord(words.buzzwords)}.`,
                `The ${getRandomWord(words.adjectives)} ${getRandomWord(words.nouns)} requires ${getRandomWord(words.adjectives)} ${getRandomWord(words.nouns)} ${getRandomWord(words.buzzwords)}.`
            ];

            const bs = templates[Math.floor(Math.random() * templates.length)];
            output.textContent = bs;
            
            // Create confetti
            createConfetti();

            // Add haptic feedback if available
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate([100, 50, 100]);
            }
        }

        // Clean up confetti periodically
        setInterval(() => {
            const confetti = document.getElementsByClassName('confetti');
            for (let i = confetti.length - 1; i >= 0; i--) {
                if (confetti[i].getBoundingClientRect().top > window.innerHeight) {
                    confetti[i].remove();
                }
            }
        }, 1000);
    </script>
</body>
</html>
