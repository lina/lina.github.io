<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 GPT Wrapper Startup Generator 🌟</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes sparkleRainbow {
            0% { filter: hue-rotate(0deg) brightness(1); }
            50% { filter: hue-rotate(180deg) brightness(1.2); }
            100% { filter: hue-rotate(360deg) brightness(1); }
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.1); filter: blur(0px); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shine {
            0% { background-position: -100% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(5deg); }
            75% { transform: translateY(15px) rotate(-5deg); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 50px rgba(139, 92, 246, 0.8), 0 0 100px rgba(139, 92, 246, 0.5); }
            100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3); }
        }

        .bg-gradient {
            background: linear-gradient(-45deg, #0F172A, #1E293B, #2E1065, #1E40AF);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid rgba(139, 92, 246, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 3s infinite;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(139, 92, 246, 0.2),
                transparent
            );
            animation: shine 8s infinite;
        }

        .sparkle-icon {
            animation: sparkleRainbow 3s ease-in-out infinite;
        }

        .button {
            background: linear-gradient(45deg, #6D28D9, #4F46E5, #7C3AED);
            background-size: 200% 200%;
            animation: gradient 5s ease infinite;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.6);
            letter-spacing: 2px;
        }

        .button:active {
            transform: scale(0.98) translateY(0);
        }

        .pitch-text {
            animation: pop 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            will-change: transform;
        }

        .highlight {
            background: linear-gradient(120deg, #6D28D9, #4F46E5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }

        .success-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(139, 92, 246, 0.9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            animation: pop 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { createElement: h, useState, useEffect } = React;
        
        const Sparkles = () => {
            return h('svg', {
                xmlns: "http://www.w3.org/2000/svg",
                width: "40",
                height: "40",
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: "inline-block ml-2 sparkle-icon text-yellow-400"
            }, [
                h('path', {
                    d: "m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"
                })
            ]);
        };
        
        const BuzzwordGenerator = () => {
            const products = [
                "personal mentor", "writing assistant", "study companion",
                "productivity coach", "content strategist", "research assistant",
                "creative director", "learning advisor", "career counselor",
                "wellness coach", "financial advisor", "life coach"
            ];

            const gptFeatures = [
                "context-aware", "personalized", "adaptive",
                "multi-modal", "real-time", "interactive",
                "conversational", "intuitive", "intelligent",
                "empathetic", "proactive", "collaborative"
            ];

            const actions = [
                "supercharges", "revolutionizes", "transforms",
                "enhances", "amplifies", "optimizes",
                "streamlines", "accelerates", "elevates",
                "personalizes", "reimagines", "democratizes"
            ];

            const domains = [
                "professional development", "creative writing",
                "personal growth", "educational success",
                "productivity optimization", "career advancement",
                "content creation", "skill acquisition",
                "knowledge management", "decision making"
            ];

            const uniqueFeatures = [
                "with real-time voice interactions",
                "featuring multimodal inputs",
                "using semantic memory",
                "with personalized learning paths",
                "powered by custom fine-tuning",
                "with advanced prompt engineering",
                "featuring collaborative AI agents",
                "using retrieval-augmented generation",
                "with context-aware responses",
                "featuring emotional intelligence"
            ];

            const generateIdea = () => {
                const product = products[Math.floor(Math.random() * products.length)];
                const feature = gptFeatures[Math.floor(Math.random() * gptFeatures.length)];
                const action = actions[Math.floor(Math.random() * actions.length)];
                const domain = domains[Math.floor(Math.random() * domains.length)];
                const unique = uniqueFeatures[Math.floor(Math.random() * uniqueFeatures.length)];
                
                const idea = `A <span class="highlight">GPT-powered ${feature} ${product}</span> that ${action} ${domain} ${unique}`;
                return idea;
            };

            const [idea, setIdea] = useState(generateIdea());
            const [showSuccess, setShowSuccess] = useState(false);

            const createConfetti = () => {
                const emojis = ['✨', '🚀', '🌟', '💫', '⚡️', '🤖', '🎯', '💡', '🎨', '🔮', '🎪'];
                const confettiCount = 100;
                const container = document.body;
                
                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.style.fontSize = `${Math.random() * 20 + 15}px`;
                    confetti.style.left = `${Math.random() * 100}vw`;
                    confetti.style.top = `${Math.random() * 100}vh`;
                    confetti.style.animation = `float ${3 + Math.random() * 2}s ease-in-out infinite`;
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    
                    container.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }
            };

            const handleClick = () => {
                setIdea(generateIdea());
                createConfetti();
                
                setShowSuccess(true);
                setTimeout(() => setShowSuccess(false), 2000);
                
                const button = document.querySelector('.button');
                button.style.transform = 'scale(0.95)';
                setTimeout(() => button.style.transform = '', 150);
            };

            return h('div', {
                className: "min-h-screen bg-gradient p-8 flex items-center justify-center relative overflow-hidden"
            }, [
                showSuccess && h('div', {
                    className: "success-message font-bold text-xl"
                }, "💡 Brilliant Idea Generated! 🚀"),
                
                h('div', {
                    className: "max-w-4xl w-full text-center z-10"
                }, [
                    h('h1', {
                        className: "text-6xl font-extrabold mb-8 text-white drop-shadow-lg tracking-tight"
                    }, [
                        "AI Wrapper Startup Generator",
                        h(Sparkles)
                    ]),
                    
                    h('div', {
                        className: "card rounded-3xl shadow-2xl p-16 mb-8"
                    }, [
                        h('div', {
                            key: idea,
                            className: "pitch-text text-4xl font-semibold text-gray-800 mb-12 leading-relaxed",
                            dangerouslySetInnerHTML: { __html: idea }
                        }),
                        
                        h('button', {
                            onClick: handleClick,
                            className: "button px-14 py-7 rounded-2xl font-bold text-2xl text-white shadow-lg transform transition-all"
                        }, "Generate Million-Dollar Idea 💎")
                    ]),
                    
                    h('p', {
                        className: "text-purple-200 text-xl font-medium mt-4"
                    }, "Building the future of AI-powered applications")
                ])
            ]);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(BuzzwordGenerator));
    </script>
</body>
</html>
