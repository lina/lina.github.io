<!DOCTYPE html>
<html>
<head>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        body {
            font-family: system-ui, -apple-system;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #FFE259, #FFA751);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .app {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #FF6B6B;
            margin: 0 0 40px 0;
        }

        .cheese {
            font-size: 120px;
            animation: float 3s ease-in-out infinite;
            margin: 40px;
            display: inline-block;
        }

        button {
            background: #FF6B6B;
            color: white;
            border: none;
            font-size: 24px;
            padding: 20px 40px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(255,107,107,0.3);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255,107,107,0.4);
        }

        .result {
            font-size: 24px;
            margin: 40px 0;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cheese-name {
            font-size: 32px;
            font-weight: bold;
            color: #FF6B6B;
            margin: 20px 0;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-20deg); }
            75% { transform: rotate(20deg); }
        }

        .calculating {
            animation: shake 0.5s infinite;
        }

        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { 
                transform: scale(1);
                opacity: 1;
            }
            100% { 
                transform: scale(20);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>WHAT CHEESE ARE YOU?!</h1>
        <div id="cheese" class="cheese">🧀</div>
        <div id="result" class="result"></div>
        <button onclick="calculateCheese()">REVEAL MY CHEESE DESTINY</button>
    </div>

    <script>
        const cheeses = [
            {
                name: "CHEDDAR",
                emoji: "🧀",
                description: "You're SHARP, BOLD, and everyone's favorite! The life of the party but also weirdly good at spreadsheets?!"
            },
            {
                name: "BRIE",
                emoji: "🧀",
                description: "FANCY ALERT! You're smooth, sophisticated, and maybe a little pretentious (but in a good way). You definitely have strong opinions about wine!"
            },
            {
                name: "MOZZARELLA",
                emoji: "🧀",
                description: "You're STRETCHY (literally and metaphorically)! Super flexible, great in a team, and everyone wants you on their pizza!"
            },
            {
                name: "BLUE CHEESE",
                emoji: "🧀",
                description: "You're CONTROVERSIAL! Some people love you, some don't get you, but you're living your best moldy life and don't care what anyone thinks!"
            },
            {
                name: "SWISS",
                emoji: "🧀",
                description: "You're full of HOLES but somehow still SOLID?! A walking contradiction who somehow makes it work. Very punctual, slightly mysterious!"
            }
        ];

        function createFirework(x, y) {
            const colors = ['#FF6B6B', '#FFE259', '#FFA751', '#4ECDC4'];
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(firework);
            setTimeout(() => firework.remove(), 1000);
        }

        function calculateCheese() {
            const cheese = document.getElementById('cheese');
            const result = document.getElementById('result');
            const button = document.querySelector('button');

            // Start calculating animation
            cheese.classList.add('calculating');
            result.classList.remove('show');
            button.disabled = true;
            button.textContent = "CALCULATING YOUR CHEESE DESTINY...";

            // Create suspense with multiple cheese flips
            let flips = 0;
            const maxFlips = 10;
            const flipInterval = setInterval(() => {
                const randomCheese = cheeses[Math.floor(Math.random() * cheeses.length)];
                cheese.textContent = randomCheese.emoji;
                flips++;

                if (flips >= maxFlips) {
                    clearInterval(flipInterval);
                    finishCalculation();
                }
            }, 100);

            function finishCalculation() {
                // Generate random fireworks
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight;
                        createFirework(x, y);
                    }, i * 50);
                }

                // Select final cheese
                const finalCheese = cheeses[Math.floor(Math.random() * cheeses.length)];
                cheese.classList.remove('calculating');
                
                result.innerHTML = `
                    <div class="cheese-name">${finalCheese.name}</div>
                    <div>${finalCheese.description}</div>
                `;
                result.classList.add('show');
                
                button.disabled = false;
                button.textContent = "CALCULATE AGAIN!";
            }
        }
    </script>
</body>
</html>
