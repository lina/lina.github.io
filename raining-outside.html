<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is It Raining Outside?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            transition: background 0.5s ease;
        }

        body.raining {
            background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .answer {
            font-size: 8rem;
            font-weight: bold;
            margin: 2rem 0;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .answer:hover {
            transform: scale(1.1);
        }

        .toggle-container {
            margin-top: 2rem;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .rain {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .rain.active {
            opacity: 1;
        }

        .drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .meta {
            position: absolute;
            bottom: 1rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .last-updated {
            margin-top: 1rem;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="rain" id="rainContainer"></div>
    <div class="container">
        <h1>Is It Raining Outside?</h1>
        <div class="answer" id="answer">NO</div>
        <div class="toggle-container">
            <button class="toggle-btn" onclick="toggleRain()">Toggle Rain</button>
        </div>
        <div class="last-updated">
            Last updated: <span id="timestamp">just now</span>
        </div>
    </div>
    <div class="meta">
        Accuracy: ±100% • Powered by looking out the window™
    </div>

    <script>
        // Create rain drops
        const rainContainer = document.getElementById('rainContainer');
        for (let i = 0; i < 100; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * 100 + '%';
            drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
            drop.style.opacity = Math.random() * 0.3 + 0.2;
            drop.style.animationDelay = Math.random() + 's';
            rainContainer.appendChild(drop);
        }

        let isRaining = false;
        const answer = document.getElementById('answer');
        const body = document.body;

        function toggleRain() {
            isRaining = !isRaining;
            answer.textContent = isRaining ? 'YES' : 'NO';
            rainContainer.classList.toggle('active');
            body.classList.toggle('raining');
            updateTimestamp();
        }

        function updateTimestamp() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-SG', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
            document.getElementById('timestamp').textContent = timeString;
        }

        // Update timestamp every minute
        setInterval(updateTimestamp, 60000);
        updateTimestamp();

        // Easter egg: Konami code makes it rain
        let konamiCode = [];
        const correctCode = [
            'ArrowUp', 'ArrowUp', 
            'ArrowDown', 'ArrowDown', 
            'ArrowLeft', 'ArrowRight', 
            'ArrowLeft', 'ArrowRight', 
            'b', 'a'
        ];

        document.addEventListener('keydown', (e) => {
            konamiCode.push(e.key);
            if (konamiCode.length > correctCode.length) {
                konamiCode.shift();
            }
            if (konamiCode.join(',') === correctCode.join(',')) {
                toggleRain();
                konamiCode = [];
            }
        });
    </script>
</body>
</html>
