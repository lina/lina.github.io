<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC Procrastination Timer</title>
    <style>
        :root {
            --gradient-1: linear-gradient(to right, #3b82f6, #8b5cf6);
            --gradient-2: linear-gradient(to right, #f59e0b, #ef4444);
            --gradient-3: linear-gradient(to right, #ef4444, #ec4899);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: #000;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .timer {
            font-size: 4rem;
            font-weight: bold;
            font-family: monospace;
            text-align: center;
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            background: var(--gradient-1);
            animation: pulse 2s infinite;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: rgba(59, 130, 246, 0.2);
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .stat-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .message {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            animation: bounce 1s infinite;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-start {
            background: var(--gradient-1);
            color: white;
        }

        .btn-stop {
            background: var(--gradient-2);
            color: white;
        }

        .btn-reset {
            background: #374151;
            color: white;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .footer {
            text-align: center;
            color: #6b7280;
            margin-top: 2rem;
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .timer {
                font-size: 2.5rem;
            }
            .message {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg width="32" height="32" fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24">
                <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
            </svg>
            <h1 class="title">EPIC PROCRASTINATION TRACKER</h1>
        </div>

        <div class="timer" id="timer">00:00:00</div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                    Money Lost
                </div>
                <div class="stat-value" id="money-lost">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    </svg>
                    Apps Not Shipped
                </div>
                <div class="stat-value" id="apps-not-shipped">0</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="buttons">
            <button class="btn btn-start" id="toggle-btn">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                START PROCRASTINATING!
            </button>
            <button class="btn btn-reset" id="reset-btn">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="m15 9-6 6m0-6 6 6"/>
                </svg>
                RESET
            </button>
        </div>
    </div>

    <script>
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const toggleBtn = document.getElementById('toggle-btn');
        const resetBtn = document.getElementById('reset-btn');
        const moneyLostEl = document.getElementById('money-lost');
        const appsNotShippedEl = document.getElementById('apps-not-shipped');

        let seconds = 0;
        let isRunning = false;
        let interval;
        let moneyLost = 0;
        let appsNotShipped = 0;

        const MONEY_PER_SECOND = 10000000 / (10 * 24 * 60 * 60); // $10M over 10 days
        const APPS_PER_SECOND = 10000000 / (10 * 24 * 60 * 60); // 10M apps over 10 days

        const formatTime = (totalSeconds) => {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        const getSassyMessage = (seconds) => {
            if (seconds < 30) return "OH LOOK! X.COM! I'M SURE THAT'S PART OF YOUR 10M MASTER PLAN! 🚀";
            if (seconds < 60) return "WHILE YOU'RE HERE, WHY NOT TWEET ABOUT THE APPS YOU'RE NOT BUILDING! 📱";
            if (seconds < 300) return "BREAKING: LOCAL DEV DISCOVERS SCROLLING WON'T MAKE MILLIONS! 🤑";
            if (seconds < 600) return "EXCUSE ME, YOUR BANK ACCOUNT CALLED - IT'S CRYING! 💸";
            if (seconds < 1200) return "PLOT TWIST: X WON'T CODE THOSE 10M APPS FOR YOU! 🎭";
            if (seconds < 1800) return "CONGRATULATIONS! YOU'VE UNLOCKED: MASTER PROCRASTINATOR MODE! 🏆";
            return "ALERT! YOUR MILLIONS HAVE LEFT TO FIND A MORE PRODUCTIVE DEVELOPER! 🏃‍♂️";
        };

        const updateTimer = () => {
            seconds++;
            timerEl.textContent = formatTime(seconds);
            messageEl.textContent = getSassyMessage(seconds);
            
            moneyLost += MONEY_PER_SECOND;
            appsNotShipped += APPS_PER_SECOND;
            
            moneyLostEl.textContent = `$${Math.floor(moneyLost).toLocaleString()}`;
            appsNotShippedEl.textContent = Math.floor(appsNotShipped).toLocaleString();

            // Update gradient based on time
            if (seconds < 300) {
                timerEl.style.background = 'var(--gradient-1)';
            } else if (seconds < 600) {
                timerEl.style.background = 'var(--gradient-2)';
            } else {
                timerEl.style.background = 'var(--gradient-3)';
            }
        };

        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                interval = setInterval(updateTimer, 1000);
                toggleBtn.classList.remove('btn-start');
                toggleBtn.classList.add('btn-stop');
                toggleBtn.innerHTML = `
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M10 15V9m4 6V9"/>
                    </svg>
                    STOP PROCRASTINATING!
                `;
            } else {
                clearInterval(interval);
                toggleBtn.classList.remove('btn-stop');
                toggleBtn.classList.add('btn-start');
                toggleBtn.innerHTML = `
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    START PROCRASTINATING!
                `;
            }
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(interval);
            seconds = 0;
            moneyLost = 0;
            appsNotShipped = 0;
            isRunning = false;
            timerEl.textContent = formatTime(0);
            messageEl.textContent = getSassyMessage(0);
            moneyLostEl.textContent = '$0';
            appsNotShippedEl.textContent = '0';
            timerEl.style.background = 'var(--gradient-1)';
            toggleBtn.classList.remove('btn-stop');
            toggleBtn.classList.add('btn-start');
            toggleBtn.innerHTML = `
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                START PROCRASTINATING!
            `;
        });

        // Initialize message
        messageEl.textContent = getSassyMessage(0);
    </script>
</body>
</html>
