<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Super Password Generator</title>
    <!-- Add confetti animation library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes scale {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            color: #0f172a;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #FF4D4D, #FF9900, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .output-section {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            margin-bottom: 2rem;
            border: 3px solid #e2e8f0;
            transition: all 0.3s ease;
            animation: scale 2s ease-in-out infinite;
        }

        .output-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .password-display {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            color: #0f172a;
            word-break: break-all;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            text-align: center;
        }

        .copy-btn {
            background: linear-gradient(45deg, #FF4D4D, #FF9900);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 0 auto;
        }

        .copy-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.3);
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem;
            background: white;
            border-radius: 1rem;
            border: 3px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.4rem;
        }

        .option-item:hover {
            transform: translateY(-3px);
            border-color: #FF4D4D;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            accent-color: #FF4D4D;
        }

        .length-controls {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 3px solid #e2e8f0;
            margin-bottom: 2rem;
        }

        .length-label {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 1rem;
            display: block;
        }

        input[type="range"] {
            width: 80%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            appearance: none;
            margin-bottom: 1rem;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, #FF4D4D, #FF9900);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
        }

        input[type="number"] {
            width: 100px;
            padding: 0.8rem;
            border: 3px solid #e2e8f0;
            border-radius: 0.8rem;
            font-size: 1.4rem;
            text-align: center;
        }

        .generate-btn {
            background: linear-gradient(45deg, #FF4D4D, #FF9900);
            color: white;
            border: none;
            padding: 1.5rem;
            border-radius: 1rem;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 77, 77, 0.3);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .strength-meter {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF4D4D, #FF9900);
            transition: width 0.5s ease;
        }

        .strength-text {
            text-align: center;
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }

        /* Sparkle elements */
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.8);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; right: 20%; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 30%; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 0.9s; }

        @keyframes success-popup {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.4rem;
            animation: success-popup 0.5s ease-out forwards;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        
        <h1>✨ Super Password Generator ✨</h1>
        
        <div class="output-section">
            <div class="password-display" id="passwordDisplay">Click Generate for Magic! ✨</div>
            <button class="copy-btn" id="copyBtn">
                📋 Copy Password
            </button>
        </div>
        
        <div class="length-controls">
            <label class="length-label">Password Length: <span id="lengthValue">20</span></label>
            <input type="range" id="lengthSlider" min="12" max="64" value="20">
            <input type="number" id="lengthInput" min="12" max="64" value="20">
        </div>
        
        <div class="options">
            <label class="option-item">
                <input type="checkbox" id="uppercase" checked>
                UPPERCASE
            </label>
            
            <label class="option-item">
                <input type="checkbox" id="lowercase" checked>
                lowercase
            </label>
            
            <label class="option-item">
                <input type="checkbox" id="numbers" checked>
                123
            </label>
            
            <label class="option-item">
                <input type="checkbox" id="symbols" checked>
                !@#$
            </label>
        </div>

        <div class="strength-meter">
            <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-text" id="strengthText">Ready to generate! 🚀</div>
        
        <button class="generate-btn" onclick="generatePassword()" id="generateBtn">
            Generate Password ⚡️
        </button>
    </div>

    <script>
        const lowercase = 'abcdefghijklmnopqrstuvwxyz';
        const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        // DOM elements
        const passwordDisplay = document.getElementById('passwordDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthInput = document.getElementById('lengthInput');
        const lengthValue = document.getElementById('lengthValue');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        function celebrateGeneration() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function showSuccessPopup(message) {
            const popup = document.createElement('div');
            popup.className = 'success-popup';
            popup.textContent = message;
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 2000);
        }

        // Sync length controls
        lengthSlider.addEventListener('input', (e) => {
            lengthInput.value = e.target.value;
            lengthValue.textContent = e.target.value;
            calculateStrength();
        });

        lengthInput.addEventListener('input', (e) => {
            let value = parseInt(e.target.value);
            if (value < 12) value = 12;
            if (value > 64) value = 64;
            e.target.value = value;
            lengthSlider.value = value;
            lengthValue.textContent = value;
            calculateStrength();
        });

        // Update strength when checkboxes change
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', calculateStrength);
        });

        function getRandomChar(str) {
            return str.charAt(Math.floor(Math.random() * str.length));
        }

        function shuffleString(str) {
            return str.split('').sort(() => Math.random() - 0.5).join('');
        }

        function calculateStrength() {
            let charset = '';
            if (document.getElementById('lowercase').checked) charset += lowercase;
            if (document.getElementById('uppercase').checked) charset += uppercase;
            if (document.getElementById('numbers').checked) charset += numbers;
            if (document.getElementById('symbols').checked) charset += symbols;

            const length = parseInt(lengthInput.value);
            const entropy = Math.floor(length * Math.log2(charset.length));
            
            let strength = 'Very Weak';
            let percentage = 0;

            if (entropy > 128) {
                strength = 'Very Strong! 💪';
                percentage = 100;
            } else if (entropy > 96) {
                strength = 'Strong! ⭐️';
                percentage = 80;
            } else if (entropy > 64) {
                strength = 'Medium 🔐';
                percentage = 60;
            } else if (entropy > 32) {
                strength = 'Weak 😅';
                percentage = 40;
            }
            
            strengthFill.style.width = percentage + '%';
            strengthText.textContent = `Password Strength: ${strength} (${entropy} bits)`;
            
            return charset;
        }

        function generatePassword() {
            const charset = calculateStrength();
            
            if (!charset) {
                passwordDisplay.classList.add('shake');
                setTimeout(() => passwordDisplay.classList.remove('shake'), 500);
                passwordDisplay.textContent = 'Please select at least one character type!';
                return;
            }

            const length = parseInt(lengthInput.value);
            let password = '';

            // Ensure at least one character from each selected type
            if (document.getElementById('lowercase').checked) password += getRandomChar(lowercase);
            if (document.getElementById('uppercase').checked) password += getRandomChar(uppercase);
            if (document.getElementById('numbers').checked) password += getRandomChar(numbers);
            if (document.getElementById('symbols').checked) password += getRandomChar(symbols);

            // Fill remaining length with random characters
            while (password.length < length) {
                password += getRandomChar(charset);
            }

            // Shuffle the password
            password = shuffleString(password);
            
            passwordDisplay.textContent = password;
            passwordDisplay.classList.add('shake');
            setTimeout(() => passwordDisplay.classList.remove('shake'), 500);
            
            // Celebrate!
            celebrateGeneration();
        }

        copyBtn.addEventListener('click', async () => {
            const password = passwordDisplay.textContent;
            if (password === 'Click Generate for Magic! ✨' || 
                password === 'Please select at least one character type!') return;
            
            try {
                await navigator.clipboard.writeText(password);
                copyBtn.textContent = '✨ Copied! ✨';
                copyBtn.classList.add('copied');
                showSuccessPopup('Password copied! 🎉');
                
                // Smaller confetti burst for copy
                confetti({
                    particleCount: 50,
                    spread: 40,
                    origin: { y: 0.7 }
                });
                
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy Password';
                    copyBtn.classList.remove('copied');
                }, 1500);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Initialize
        calculateStrength();
    </script>
</body>
</html>
