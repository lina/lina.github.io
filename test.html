<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Slay Quotes - Dopamine Edition ✨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #ff69b4;
            --secondary: #4dd0e1;
            --bg-start: #ffe6f2;
            --bg-end: #e6f9fc;
            --glass: rgba(255, 255, 255, 0.25);
            --border: rgba(255, 255, 255, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(-45deg, #ff6b6b, #ff9f9f, #6b8fff, #9f6bff, #ff6bd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: all 0.5s ease;
        }

        body.theme-neon {
            background: linear-gradient(-45deg, #00ff87, #60efff, #ff00ff, #ff8d00);
            background-size: 400% 400%;
        }

        body.theme-sunset {
            background: linear-gradient(-45deg, #ff512f, #ff758c, #ff8c69, #ffd700);
            background-size: 400% 400%;
        }

        body.theme-galaxy {
            background: linear-gradient(-45deg, #7f00ff, #4a148c, #311b92, #1a237e);
            background-size: 400% 400%;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 30px;
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                0 0 10px rgba(255, 255, 255, 0.1),
                0 0 20px rgba(255, 255, 255, 0.1);
            margin: 2rem 0;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .quote-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.2) 0%,
                rgba(255,255,255,0) 50%,
                rgba(255,255,255,0.1) 100%);
            transform: translateY(-100%);
            transition: transform 0.5s ease;
        }

        .quote-card:hover::before {
            transform: translateY(100%);
        }

        .quote-card:hover {
            transform: translateY(-10px) scale(1.02) rotateX(5deg);
            box-shadow: 
                0 15px 45px rgba(0,0,0,0.2),
                0 0 30px rgba(255, 255, 255, 0.2);
        }

        .quote-text {
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
            line-height: 1.5;
            font-weight: 600;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--primary); }
            50% { text-shadow: 0 0 20px #fff, 0 0 40px #fff, 0 0 60px var(--primary); }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--primary); }
        }

        h1 {
            font-size: 4rem;
            margin: 2rem 0;
            color: white;
            text-shadow: 
                0 0 10px rgba(255,255,255,0.8),
                0 0 20px rgba(255,255,255,0.8),
                0 0 30px rgba(255,255,255,0.8);
            animation: neonPulse 2s ease-in-out infinite;
        }

        .button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            border-radius: 30px;
            font-size: 1.3rem;
            cursor: pointer;
            margin: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.2),
                0 0 30px rgba(255,255,255,0.8);
        }

        .mood-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .mood-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.1),
                0 0 15px rgba(255,255,255,0.5);
            background: rgba(255, 255, 255, 0.3);
        }

        .mood-button.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.2),
                0 0 30px rgba(255,255,255,0.8);
            transform: translateY(-5px);
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.7; }
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
            font-size: 1.5rem;
            z-index: 1000;
        }

        /* Additional enhanced styles... */
    </style>
</head>
<body>
    <!-- Rest of the HTML structure remains the same -->
    <script>
        // Enhanced JavaScript with more dynamic effects...
        function createSparkles() {
            const colors = ['#FFD700', '#FF69B4', '#00FFFF', '#FF1493', '#7FFFD4'];
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.innerHTML = ['✨', '💫', '⭐️', '🌟'][Math.floor(Math.random() * 4)];
                    sparkle.style.left = `${Math.random() * window.innerWidth}px`;
                    sparkle.style.top = `${Math.random() * window.innerHeight}px`;
                    sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 3000);
                }, i * 100);
            }
        }

        // More enhanced JavaScript functionality...
    </script>
</body>
</html>
