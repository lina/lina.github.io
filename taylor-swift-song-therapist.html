<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Swiftie Lyrics Problem Blaster 🚀</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @keyframes superGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)) brightness(1); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.9)) brightness(1.2); }
        }

        @keyframes cosmic {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(2deg); }
            75% { transform: translateY(15px) rotate(-2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        :root {
            /* Ultra Vibrant Colors */
            --neon-pink: #FF00FF;
            --electric-blue: #00FFFF;
            --plasma-green: #00FF9C;
            --solar-yellow: #FFE600;
            --cosmic-purple: #B24BFF;
            --nova-orange: #FF6B2B;
            
            /* Dynamic Gradients */
            --cosmic-gradient: linear-gradient(
                45deg,
                var(--neon-pink),
                var(--electric-blue),
                var(--plasma-green),
                var(--solar-yellow),
                var(--cosmic-purple),
                var(--nova-orange)
            );
            
            /* Glowing Effects */
            --glow-primary: 0 0 20px rgba(255, 255, 255, 0.8);
            --glow-secondary: 0 0 40px rgba(178, 75, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: black;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
        }

        .cosmic-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                125deg,
                #FF00FF 0%,
                #00FFFF 25%,
                #00FF9C 50%,
                #FFE600 75%,
                #FF00FF 100%
            );
            opacity: 0.15;
            background-size: 400% 400%;
            animation: cosmic 15s ease infinite;
            z-index: -1;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            margin: 2rem 0;
            background: var(--cosmic-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: superGlow 3s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        .logo::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--cosmic-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(15px);
            opacity: 0.8;
            z-index: -1;
        }

        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            transform-style: preserve-3d;
        }

        .chat-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 2rem;
            height: 60vh;
            overflow-y: auto;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .chat-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--cosmic-gradient);
            border-radius: 32px;
            z-index: -1;
            animation: pulse 3s ease-in-out infinite;
        }

        .message {
            margin: 1.5rem 0;
            padding: 1.5rem;
            border-radius: 25px;
            color: white;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
            animation: float 6s ease-in-out infinite;
        }

        .message::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--cosmic-gradient);
            background-size: 200% 200%;
            animation: cosmic 5s linear infinite;
            opacity: 0.9;
            z-index: -1;
        }

        .user-message {
            margin-left: auto;
            max-width: 80%;
            transform-origin: right center;
        }

        .therapist-message {
            margin-right: auto;
            max-width: 80%;
            transform-origin: left center;
        }

        .message:hover {
            transform: scale(1.05) translateZ(30px);
            box-shadow: var(--glow-primary), var(--glow-secondary);
        }

        .input-wrapper {
            margin-top: 2rem;
            position: relative;
            transform-style: preserve-3d;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .input-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--cosmic-gradient);
            border-radius: 32px;
            z-index: -1;
            animation: cosmic 5s linear infinite;
        }

        .message-input {
            flex: 1;
            padding: 1.5rem;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: var(--glow-primary);
            transform: translateZ(20px);
        }

        .send-button {
            padding: 1.5rem 3rem;
            border: none;
            border-radius: 20px;
            background: var(--cosmic-gradient);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .send-button:hover {
            transform: translateZ(30px) scale(1.1);
            box-shadow: var(--glow-primary);
            animation: superGlow 2s ease-in-out infinite;
        }

        /* Particle Effects */
        .particle {
            position: fixed;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--cosmic-gradient);
            border-radius: 6px;
            border: 3px solid transparent;
            background-clip: content-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--cosmic-gradient);
            background-clip: content-box;
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    
    <h1 class="logo" data-text="🚀 Swiftie Lyrics Problem Blaster 🚀">
        🚀 Swiftie Lyrics Problem Blaster 🚀
    </h1>
    
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message therapist-message animate__animated animate__fadeInLeft">
                <div class="message-content">
                    ⚡️ Welcome to your consciousness stream space! Let's help turn your thoughts into PURE MAGIC! ✨
                </div>
            </div>
        </div>
        
        <div class="input-wrapper">
            <div class="input-container">
                <input 
                    type="text" 
                    class="message-input" 
                    placeholder="✨ Share your electrifying thoughts..." 
                    autofocus
                >
                <button class="send-button">
                    Blast Off! 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        // 3D Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            document.querySelector('.chat-box').style.transform = 
                `perspective(1000px) 
                 rotateX(${(y - 0.5) * 10}deg) 
                 rotateY(${(x - 0.5) * 10}deg)`;
        });

        // Particle Trail Effect
        function createParticle(x, y) {
            const colors = [
                '#FF00FF', '#00FFFF', '#00FF9C', 
                '#FFE600', '#B24BFF', '#FF6B2B'
            ];
            
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 10 + 5;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            document.body.appendChild(particle);
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 5 + 2;
            const dx = Math.cos(angle) * velocity;
            const dy = Math.sin(angle) * velocity;
            
            let opacity = 1;
            
            function animate() {
                if (opacity <= 0) {
                    particle.remove();
                    return;
                }
                
                const currentLeft = parseFloat(particle.style.left);
                const currentTop = parseFloat(particle.style.top);
                
                particle.style.left = `${currentLeft + dx}px`;
                particle.style.top = `${currentTop + dy}px`;
                
                opacity -= 0.02;
                particle.style.opacity = opacity;
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        let lastX = 0;
        let lastY = 0;

        document.addEventListener('mousemove', (e) => {
            const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);
            
            if (distance > 20) {
                createParticle(e.clientX, e.clientY);
                lastX = e.clientX;
                lastY = e.clientY;
            }
        });

        // Interactive Elements
        document.querySelectorAll('.message, .send-button').forEach(element => {
            element.addEventListener('mouseover', () => {
                element.style.transform = 'scale(1.05) translateZ(50px)';
                createParticle(
                    element.getBoundingClientRect().left + element.offsetWidth / 2,
                    element.getBoundingClientRect().top + element.offsetHeight / 2
                );
            });
            
            element.addEventListener('mouseout', () => {
                element.style.transform = 'scale(1) translateZ(0)';
            });
        });
    </script>
</body>
</html>
