<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #9333ea, #ec4899, #f97316);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: white;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
    }

    .title {
      font-size: 4rem;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255,215,0, 0.5);
      animation: pulse 2s infinite;
      margin-bottom: 2rem;
    }

    .cookie-container {
      width: 300px;
      height: 300px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      perspective: 1000px;
      animation: bounce 1.5s infinite;
    }

    .cookie-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.3s;
    }

    .cookie-half {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNmYmJmMjQiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMiAxMmgyTDExLjUgNC41YTQuOCA0LjggMCAwIDEgNyA3TTE1LjUgMTEuNUwyMiAxMmgtMmwtNy41IDcuNWE0LjggNC44IDAgMCAxLTctN0wxMiAxNiIvPjwvc3ZnPg==");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.5));
    }

    .cookie-bottom {
      transform: translateZ(-2px);
      opacity: 0.8;
    }

    .cookie-top {
      transform: translateZ(2px);
    }

    .cookie-container:hover .cookie-wrapper {
      transform: scale(1.2) rotate(5deg);
    }

    .cookie-sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fef3c7;
      border-radius: 50%;
      animation: cookieSparkle 1.5s infinite;
    }

    @keyframes cookieSparkle {
      0%, 100% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
    }

    .cookie-half {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s;
    }

    .cookie-top {
      transform: rotateX(-10deg);
    }

    .cookie-bottom {
      transform: rotateX(10deg);
      background: linear-gradient(135deg, #d97706, #92400e);
    }

    .cookie-container:hover .cookie-top {
      transform: rotateX(-20deg) translateY(-10px);
    }

    .cookie-container:hover .cookie-bottom {
      transform: rotateX(20deg) translateY(10px);
    }

    .cookie-shadow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      filter: blur(10px);
      transform: translateY(20px) rotateX(90deg) scale(0.8);
    }

    .bomb-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      animation: pulse 1s infinite;
      z-index: 2;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode var(--duration) ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(var(--x), var(--y)) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(
          calc(var(--x) + var(--dx) * 150px),
          calc(var(--y) + var(--dy) * 150px)
        ) scale(0) rotate(720deg);
        opacity: 0;
      }
    }

    .fortune {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.3);
      max-width: 400px;
      animation: fortuneAppear 0.5s ease-out forwards;
      opacity: 0;
      text-align: center;
      border: 4px solid #fbbf24;
    }

    .fortune-text {
      font-size: 1.75rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: #1f2937;
      line-height: 1.4;
    }

    .sparkle {
      position: absolute;
      background: #fef3c7;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: sparkle 1s ease-out forwards;
    }

    @keyframes sparkle {
      0% {
        transform: translate(var(--x), var(--y)) scale(0);
        opacity: 1;
      }
      50% {
        transform: translate(
          calc(var(--x) + var(--dx) * 100px),
          calc(var(--y) + var(--dy) * 100px)
        ) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(
          calc(var(--x) + var(--dx) * 200px),
          calc(var(--y) + var(--dy) * 200px)
        ) scale(0);
        opacity: 0;
      }
    }

    .reset-btn {
      background: linear-gradient(to right, #fbbf24, #f97316);
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
      text-transform: uppercase;
    }

    .reset-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
    }

    .stats {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      display: flex;
      gap: 2rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      border-radius: 9999px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    @keyframes cookieWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    @keyframes cookieAppear {
      0% { 
        opacity: 0;
        transform: scale(0.5) rotate(-20deg);
      }
      100% { 
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes fortuneDisappear {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8) rotate(5deg);
      }
    }

    @keyframes fortuneAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8) rotate(-5deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    .shockwave {
      position: absolute;
      border: 4px solid #fef3c7;
      border-radius: 50%;
      animation: shockwave 0.5s ease-out forwards;
    }

    @keyframes shockwave {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
        border-width: 4px;
      }
      100% {
        width: 500px;
        height: 500px;
        opacity: 0;
        border-width: 1px;
        margin-left: -250px;
        margin-top: -250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Combo: <span id="combo">1</span>x</div>
    </div>
    <h1 class="title">EPIC FORTUNE COOKIE</h1>
    <div class="cookie-container" id="cookie">
      <div class="cookie-wrapper">
        <div class="cookie-shadow"></div>
        <div class="cookie-half cookie-bottom"></div>
        <div class="cookie-half cookie-top"></div>
        <svg class="bomb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
          <circle cx="12" cy="12" r="8"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </div>
      <!-- Sparkles will be added here by JavaScript -->
    </div>
    
    <script>
      // Initialize sparkles
      createSparkles();
      // Start with some confetti
      createConfetti();
    </script>
  </div>

  <script>
    // ... [Previous JavaScript remains the same] ...
    const fortunes = [
      "🚀 YOUR NEXT STARTUP WILL BE WORTH $999 TRILLION",
      "⚡ YOU'LL CREATE AN AI THAT ONLY GENERATES MEMES",
      "💎 YOUR CODE IS SO CLEAN IT MAKES SOAP JEALOUS",
      "🌈 YOU'LL DEBUG SO FAST IT BREAKS THE SPACE-TIME CONTINUUM",
      "🦄 YOUR NEXT FEATURE WILL MAKE COMPETITORS CRY",
      "🎯 YOUR DEPLOY WILL BE SO SMOOTH IT DEFIES PHYSICS",
      "🎨 YOUR UI WILL WIN EVERY DESIGN AWARD (EVEN THE ONES THAT DON'T EXIST)",
      "🎮 YOUR APP WILL GO SO VIRAL IT BREAKS THE INTERNET... THRICE",
      "🌟 YOUR CODE WILL MAKE SENIOR DEVS QUESTION THEIR CAREER CHOICES",
      "🚁 TECH GIANTS WILL FIGHT OVER YOUR GITHUB STARS"
    ];

    let score = 0;
    let combo = 1;
    let canClick = true;

    function createParticle(x, y, color, duration) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.background = color;
      particle.style.width = '10px';
      particle.style.height = '10px';
      particle.style.setProperty('--x', x + 'px');
      particle.style.setProperty('--y', y + 'px');
      particle.style.setProperty('--dx', (Math.random() - 0.5) * 2);
      particle.style.setProperty('--dy', (Math.random() - 0.5) * 2);
      particle.style.setProperty('--duration', duration + 's');
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), duration * 1000);
    }

    function createShockwave(x, y) {
      const wave = document.createElement('div');
      wave.className = 'shockwave';
      wave.style.left = x + 'px';
      wave.style.top = y + 'px';
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 500);
    }

    function explode(x, y) {
      // Create multiple layers of particles
      const colors = ['#fbbf24', '#f97316', '#ef4444', '#fef3c7'];
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          createParticle(x, y, colors[i % colors.length], 1 + Math.random());
        }, i * 20);
      }
      
      // Create shockwave
      createShockwave(x, y);
      
      // Create sparkles
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const sparkle = document.createElement('div');
          sparkle.className = 'sparkle';
          sparkle.style.left = x + 'px';
          sparkle.style.top = y + 'px';
          sparkle.style.setProperty('--x', x + 'px');
          sparkle.style.setProperty('--y', y + 'px');
          sparkle.style.setProperty('--dx', (Math.random() - 0.5) * 2);
          sparkle.style.setProperty('--dy', (Math.random() - 0.5) * 2);
          document.body.appendChild(sparkle);
          setTimeout(() => sparkle.remove(), 1000);
        }, i * 50);
      }
    }

    function showFortune() {
      const fortune = document.createElement('div');
      fortune.className = 'fortune';
      fortune.innerHTML = `
        <div class="fortune-text">${fortunes[Math.floor(Math.random() * fortunes.length)]}</div>
        <button class="reset-btn" onclick="reset()">CRUSH ANOTHER! 🚀</button>
      `;
      document.body.appendChild(fortune);
    }

    function updateStats() {
      document.getElementById('score').textContent = score;
      document.getElementById('combo').textContent = combo;
    }

    function reset() {
      const fortune = document.querySelector('.fortune');
      if (fortune) {
        fortune.style.animation = 'fortuneDisappear 0.5s ease-out forwards';
        setTimeout(() => fortune.remove(), 500);
      }
      
      const cookieContainer = document.querySelector('.cookie-container');
      cookieContainer.style.display = 'block';
      cookieContainer.style.animation = 'cookieAppear 0.5s ease-out forwards';
      
      canClick = true;
      combo++;
      updateStats();
    }

    const originalTransform = window.getComputedStyle(document.querySelector('.cookie-wrapper')).transform;
    
    function animateCookie() {
      const wrapper = document.querySelector('.cookie-wrapper');
      wrapper.style.animation = 'cookieWiggle 0.5s ease-in-out';
      wrapper.addEventListener('animationend', () => {
        wrapper.style.animation = '';
      }, { once: true });
    }

    // Add hover animation
    document.querySelector('.cookie-container').addEventListener('mouseenter', animateCookie);

    document.getElementById('cookie').addEventListener('click', (e) => {
      if (!canClick) return;
      canClick = false;
      
      const rect = e.target.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      
      const container = document.querySelector('.cookie-container');
      container.style.animation = 'fortuneDisappear 0.3s ease-out forwards';
      setTimeout(() => container.style.display = 'none', 300);
      explode(x, y);
      
      score += 1000 * combo;
      updateStats();
      
      setTimeout(showFortune, 1000);
    });
  </script>
</body>
</html>
