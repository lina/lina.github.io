<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #9333ea, #ec4899, #f97316);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: white;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
    }

    .stats {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      display: flex;
      gap: 2rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      border-radius: 9999px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .title {
      font-size: 4rem;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255,215,0, 0.5);
      animation: pulse 2s infinite;
    }

    .cookie-container {
      width: 300px;
      height: 300px;
      position: relative;
      perspective: 1000px;
      cursor: pointer;
      animation: bounce 1.5s infinite;
    }

    .cookie-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.3s;
    }

    .cookie-half {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 20% 20%;
      background: linear-gradient(135deg, #fcd34d, #d97706);
      box-shadow: 
        inset -5px -5px 15px rgba(0,0,0,0.2),
        inset 5px 5px 15px rgba(255,255,255,0.5),
        0 0 20px rgba(251, 191, 36, 0.5);
      transform-origin: center bottom;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cookie-top {
      clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
      transform: translateY(-10px) rotateX(5deg);
    }

    .cookie-bottom {
      clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      transform: translateY(10px) rotateX(-5deg);
      background: linear-gradient(135deg, #d97706, #92400e);
    }

    .cookie-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(#92400e 1px, transparent 2px);
      background-size: 10px 10px;
      opacity: 0.1;
    }

    .cookie-container:hover .cookie-top {
      transform: translateY(-20px) rotateX(25deg);
    }

    .cookie-container:hover .cookie-bottom {
      transform: translateY(20px) rotateX(-25deg);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: explode var(--duration) ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(var(--x), var(--y)) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(
          calc(var(--x) + var(--dx) * 150px),
          calc(var(--y) + var(--dy) * 150px)
        ) scale(0) rotate(720deg);
        opacity: 0;
      }
    }

    .fortune {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.3);
      max-width: 400px;
      animation: fortuneAppear 0.5s ease-out forwards;
      text-align: center;
      border: 4px solid #fbbf24;
      color: #1f2937;
    }

    .fortune-text {
      font-size: 1.75rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .reset-btn {
      background: linear-gradient(to right, #fbbf24, #f97316);
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .reset-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
    }

    @keyframes fortuneAppear {
      0% { 
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8) rotate(-5deg);
      }
      100% { 
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    @keyframes fortuneDisappear {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8) rotate(5deg);
      }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--confetti-color);
      opacity: 0;
      animation: confettiFall var(--fall-duration) ease-in forwards var(--fall-delay);
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-100vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }

    .shockwave {
      position: absolute;
      border: 4px solid #fef3c7;
      border-radius: 50%;
      animation: shockwave 0.5s ease-out forwards;
    }

    @keyframes shockwave {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
        border-width: 4px;
      }
      100% {
        width: 500px;
        height: 500px;
        opacity: 0;
        border-width: 1px;
        margin-left: -250px;
        margin-top: -250px;
      }
    }
  </style>
</head>

    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Combo: <span id="combo">1</span>x</div>

    <h1 class="title">EPIC FORTUNE COOKIE</h1>
    <div class="cookie-container" id="cookie">

        <div class="cookie-half cookie-top">

  <script>
    const FORTUNES = [
      "🚀 YOUR NEXT STARTUP WILL BE WORTH $999 TRILLION",
      "⚡ YOU'LL CREATE AN AI THAT ONLY GENERATES MEMES",
      "💎 YOUR CODE IS SO CLEAN IT MAKES SOAP JEALOUS",
      "🌈 YOU'LL DEBUG SO FAST IT BREAKS THE SPACE-TIME CONTINUUM",
      "🦄 YOUR NEXT FEATURE WILL MAKE COMPETITORS CRY",
      "🎯 YOUR DEPLOY WILL BE SO SMOOTH IT DEFIES PHYSICS",
      "🎨 YOUR UI WILL WIN EVERY DESIGN AWARD (EVEN THE ONES THAT DON'T EXIST)",
      "🎮 YOUR APP WILL GO SO VIRAL IT BREAKS THE INTERNET... THRICE",
      "🌟 YOUR CODE WILL MAKE SENIOR DEVS QUESTION THEIR CAREER CHOICES",
      "🚁 TECH GIANTS WILL FIGHT OVER YOUR GITHUB STARS"
    ];

    let score = 0;
    let combo = 1;
    let canClick = true;

    function createParticle(x, y, color, duration) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.background = color;
      particle.style.setProperty('--duration', duration + 's');
      particle.style.setProperty('--x', x + 'px');
      particle.style.setProperty('--y', y + 'px');
      particle.style.setProperty('--dx', (Math.random() - 0.5) * 2);
      particle.style.setProperty('--dy', (Math.random() - 0.5) * 2);
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), duration * 1000);
    }

    function createShockwave(x, y) {
      const wave = document.createElement('div');
      wave.className = 'shockwave';
      wave.style.left = x + 'px';
      wave.style.top = y + 'px';
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 500);
    }

    function explode(x, y) {
      document.getElementById('explosion-sound').play();

      // Create multiple layers of particles
      const colors = ['#fbbf24', '#f97316', '#ef4444', '#fef3c7'];
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          createParticle(x, y, colors[i % colors.length], 1 + Math.random());
        }, i * 20);
      }

      // Create multiple shockwaves
      for (let i = 0; i < 3; i++) {
        setTimeout(() => createShockwave(x, y), i * 100);
      }

      // Create confetti
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.setProperty('--confetti-color', colors[Math.floor(Math.random() * colors.length)]);
          confetti.style.setProperty('--fall-duration', (Math.random() * 3 + 2) + 's');
          confetti.style.setProperty('--fall-delay', (Math.random() * 2) + 's');
          confetti.style.left = Math.random() * 100 + 'vw';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }, i * 50);
      }
    }

    function showFortune() {
      const fortune = document.createElement('div');
      fortune.className = 'fortune';
      fortune.innerHTML = `
        <div class="fortune-text">${FORTUNES[Math.floor(Math.random() * FORTUNES.length)]}</div>
        <button class="reset-btn" onclick="reset()">CRUSH ANOTHER! 🚀</button>
      `;
      document.body.appendChild(fortune);
    }

    function reset() {
      document.querySelector('.fortune')?.remove();
      document.querySelector('.cookie-container').style.display = 'block';
      canClick = true;
      combo++;
      document.getElementById('combo').textContent = combo;
    }
