<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Translator For Humans 🌍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2dd4bf 0%, #0891b2 100%);
            color: #f0fdfa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        option {
            background: #0891b2;
            color: white;
        }

        .result {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 2rem;
            text-align: center;
        }

        .time-display {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .context {
            font-style: italic;
            margin-bottom: 1rem;
        }

        .coffee-level {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .coffee-meter {
            display: flex;
            gap: 0.25rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .coffee-bean {
            animation: bounce 1s infinite;
            animation-delay: calc(var(--delay) * 0.1s);
        }

        .activity-suggestion {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .mood-indicator {
            font-size: 2rem;
            margin: 1rem 0;
            animation: bounce 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Time Zone Translator 🌍</h1>
        <p class="subtitle">Because time zones are hard, coffee is necessary</p>

        <div class="input-group">
            <label>Your Time</label>
            <input type="time" id="localTime" value="09:00">
            <select id="localZone">
                <!-- Time zones will be populated by JS -->
            </select>
        </div>

        <div class="input-group">
            <label>Their Time</label>
            <select id="targetZone">
                <!-- Time zones will be populated by JS -->
            </select>
        </div>

        <div class="result" id="result" style="display: none;">
            <div class="time-display" id="convertedTime"></div>
            <div class="context" id="context"></div>
            <div class="coffee-level">
                Coffee Level: <div class="coffee-meter" id="coffeeMeter"></div>
            </div>
            <div class="mood-indicator" id="moodIndicator"></div>
            <div class="activity-suggestion" id="activitySuggestion"></div>
        </div>

        <footer>
            * Coffee levels scientifically* calculated
            <br>
            ** Science may or may not involve actual science
        </footer>
    </div>

    <script>
        const timeZones = [
            { value: 'Asia/Singapore', label: 'Singapore' },
            { value: 'America/New_York', label: 'New York' },
            { value: 'America/Los_Angeles', label: 'San Francisco' },
            { value: 'Europe/London', label: 'London' },
            { value: 'Europe/Paris', label: 'Paris' },
            { value: 'Asia/Tokyo', label: 'Tokyo' },
            { value: 'Australia/Sydney', label: 'Sydney' },
            { value: 'Asia/Dubai', label: 'Dubai' },
            { value: 'Europe/Amsterdam', label: 'Amsterdam' },
            { value: 'Asia/Kolkata', label: 'India' }
        ];

        const contexts = {
            early: [
                "They're starting their day... maybe send coffee?",
                "Early bird gets the... more meetings?",
                "Breakfast meetings are cruel, don't do it"
            ],
            workday: [
                "Prime meeting time! They're caffeinated!",
                "They're in the zone (both time and productivity)",
                "Perfect time for that 'quick sync'"
            ],
            evening: [
                "They're wrapping up... keep it brief!",
                "Last chance before they escape!",
                "Maybe wait until tomorrow?"
            ],
            late: [
                "They're probably sleeping... or debugging",
                "Unless it's on fire, let them rest",
                "Seriously? At this hour?"
            ]
        };

        const activities = {
            early: [
                "Perfect time for: Pretending to be a morning person",
                "Suggested activity: Staring at coffee machine",
                "Current status: Brain.exe is still loading"
            ],
            workday: [
                "Perfect time for: Actually getting work done",
                "Suggested activity: Back-to-back meetings (jk, don't)",
                "Current status: Peak productivity (theoretically)"
            ],
            evening: [
                "Perfect time for: Planning their escape",
                "Suggested activity: Strategic 'network issues'",
                "Current status: Dinner > Meetings"
            ],
            late: [
                "Perfect time for: Netflix debugging sessions",
                "Suggested activity: Sleep (revolutionary, I know)",
                "Current status: Away - Return time unknown"
            ]
        };

        const moods = {
            early: "🥱",
            workday: "💪",
            evening: "😴",
            late: "👻"
        };

        function populateTimeZones() {
            const localZone = document.getElementById('localZone');
            const targetZone = document.getElementById('targetZone');
            
            timeZones.forEach(tz => {
                const option1 = new Option(tz.label, tz.value);
                const option2 = new Option(tz.label, tz.value);
                localZone.add(option1);
                targetZone.add(option2);
            });

            // Set defaults
            localZone.value = 'Asia/Singapore';
            targetZone.value = 'America/New_York';
        }

        function getTimeContext(hour) {
            if (hour >= 5 && hour < 9) return 'early';
            if (hour >= 9 && hour < 17) return 'workday';
            if (hour >= 17 && hour < 22) return 'evening';
            return 'late';
        }

        function getCoffeeLevel(hour) {
            if (hour >= 5 && hour < 9) return 4;
            if (hour >= 9 && hour < 12) return 3;
            if (hour >= 12 && hour < 15) return 2;
            if (hour >= 15 && hour < 18) return 3;
            return 1;
        }

        function updateTime() {
            const localTime = document.getElementById('localTime').value;
            const [hours, minutes] = localTime.split(':').map(Number);
            const localZone = document.getElementById('localZone').value;
            const targetZone = document.getElementById('targetZone').value;

            // Convert time
            const date = new Date();
            date.setHours(hours);
            date.setMinutes(minutes);
            
            const localOffset = new Date().getTimezoneOffset();
            const targetDate = new Date(date.getTime() + localOffset * 60000);
            
            // Format time
            const targetHour = targetDate.getHours();
            const targetMinutes = targetDate.getMinutes();
            const timeString = `${targetHour.toString().padStart(2, '0')}:${targetMinutes.toString().padStart(2, '0')}`;

            // Update display
            document.getElementById('result').style.display = 'block';
            document.getElementById('convertedTime').textContent = timeString;

            const context = getTimeContext(targetHour);
            document.getElementById('context').textContent = 
                contexts[context][Math.floor(Math.random() * contexts[context].length)];

            const coffeeLevel = getCoffeeLevel(targetHour);
            const coffeeMeter = document.getElementById('coffeeMeter');
            coffeeMeter.innerHTML = Array(coffeeLevel).fill('☕').map((coffee, i) => 
                `<span class="coffee-bean" style="--delay: ${i}">☕</span>`
            ).join('');

            document.getElementById('moodIndicator').textContent = moods[context];

            document.getElementById('activitySuggestion').textContent = 
                activities[context][Math.floor(Math.random() * activities[context].length)];

            // Add fade-in effect
            document.getElementById('result').classList.remove('fade-in');
            void document.getElementById('result').offsetWidth; // Trigger reflow
            document.getElementById('result').classList.add('fade-in');
        }

        // Initialize
        populateTimeZones();
        document.getElementById('localTime').addEventListener('change', updateTime);
        document.getElementById('localZone').addEventListener('change', updateTime);
        document.getElementById('targetZone').addEventListener('change', updateTime);

        // Initial update
        updateTime();

        // Easter egg: Type "coffee" to max out coffee level
        let coffeeCode = [];
        document.addEventListener('keypress', (e) => {
            coffeeCode.push(e.key);
            if (coffeeCode.length > 6) coffeeCode.shift();
            if (coffeeCode.join('') === 'coffee') {
                document.getElementById('coffeeMeter').innerHTML = 
                    Array(10).fill('☕').map((coffee, i) => 
                        `<span class="coffee-bean" style="--delay: ${i}">☕</span>`
                    ).join('');
                coffeeCode = [];
            }
        });
    </script>
</body>
</html>
